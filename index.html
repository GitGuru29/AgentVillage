<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Village</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0e1320;
        font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, sans-serif;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #app canvas {
        display: block;
      }

      /* ---- top HUD bar ------------------------------------------------- */
      #topbar {
        position: fixed;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        display: flex;
        gap: 10px;
        user-select: none;
        pointer-events: none;
      }
      .stat {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 16px;
        border-radius: 12px;
        background: rgba(12, 16, 28, 0.82);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(6px);
        color: #eef3ff;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.01em;
        font-variant-numeric: tabular-nums;
      }
      .stat .swatch {
        width: 14px;
        height: 14px;
        border-radius: 4px;
        box-shadow: 0 0 8px currentColor;
      }
      .stat .label {
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.12em;
        opacity: 0.55;
      }
      .swatch.tokens {
        background: #ffb84d;
        color: #ffb84d;
      }
      .swatch.cost {
        background: #4fe3c1;
        color: #4fe3c1;
      }
      .swatch.shipped {
        background: #4fd67a;
        color: #4fd67a;
      }
      .swatch.agents {
        background: #7ef0ff;
        color: #7ef0ff;
      }

      /* ---- connection chip --------------------------------------------- */
      .hud-chip {
        position: fixed;
        bottom: 14px;
        left: 14px;
        z-index: 10;
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 7px 12px;
        border-radius: 10px;
        background: rgba(12, 16, 28, 0.78);
        color: #e8eefc;
        font-size: 12px;
        letter-spacing: 0.02em;
        backdrop-filter: blur(6px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        user-select: none;
      }
      .hud-chip .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #e05252;
        box-shadow: 0 0 6px currentColor;
      }
      .hud-chip .dot.on {
        background: #4fd67a;
      }
      .hud-chip .last {
        opacity: 0.7;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div id="topbar">
      <div class="stat">
        <span class="swatch tokens"></span>
        <span class="label">TOKENS</span>
        <span id="stat-tokens">0</span>
      </div>
      <div class="stat">
        <span class="swatch cost"></span>
        <span class="label">COST</span>
        <span id="stat-cost">$0.00</span>
      </div>
      <div class="stat">
        <span class="swatch shipped"></span>
        <span class="label">SHIPPED</span>
        <span id="stat-shipped">0</span>
      </div>
      <div class="stat">
        <span class="swatch agents"></span>
        <span class="label">AGENTS</span>
        <span id="stat-agents">0 / 0</span>
      </div>
    </div>

    <div class="hud-chip">
      <span class="dot" id="conn-dot"></span>
      <span>Agent Village</span>
      <span class="last" id="last-event">no events yet</span>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
